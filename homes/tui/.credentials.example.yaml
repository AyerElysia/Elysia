# Copy to .credentials.yaml and fill in your own keys.
#
# The real file is ignored by git. Values here are referenced by name from
# homes/shared/models.patch.yml (apiKeyEnv) and from the plugins
# (process.env.ELYSIA_* reads a path, not a secret).
#
# Keep this file's permissions at 600: chmod 600 .credentials.yaml

version: 1
refs:
  EXAMPLE_API_KEY: sk-replace-me
  # DeepSeek's own endpoint, if you use it.
  DEEPSEEK_API_KEY: sk-replace-me
