# Remote access for the web surface.
#
# Copy the block below into homes/web/profiles/web/cordis.patch.yml when this
# host serves the pairing flow, or delete this file if it does not.
#
# publicBaseUrl names the Cloudflare quick tunnel this host runs on its own:
#
#   cd homes/web/profiles/web/node_modules/cloudflared \
#     && ./bin/cloudflared tunnel --url http://127.0.0.1:3299 --protocol http2
#
# autoTunnel stays false — with it on the plugin starts a second cloudflared and
# reports a hostname that rotates out from under an already-paired device.
#
# A quick tunnel's hostname changes when cloudflared restarts. Either update the
# value below then, or export DSH_REMOTE_PUBLIC_URL and let the expression fall
# back to it, so the checked-in default can stay generic.

- insert:
    - id: remote-web-ui
      name: '@linxin666/dsh-remote-web-ui'
      config:
        autoTunnel: false
        publicBaseUrl: !!js process.env.DSH_REMOTE_PUBLIC_URL ??
          'https://example.trycloudflare.com'

