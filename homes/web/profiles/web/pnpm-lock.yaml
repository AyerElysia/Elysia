lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    dependencies:
      '@elysia/conscious-mind':
        specifier: file:../../../../plugins/conscious-mind
        version: file:../../../../plugins/conscious-mind
      '@elysia/feishu-app':
        specifier: file:../../../../plugins/feishu-app
        version: file:../../../../plugins/feishu-app(@elysia/conscious-mind@file:../../../../plugins/conscious-mind)
      '@elysia/kook-bot':
